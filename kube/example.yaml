apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: example
    app.kubernetes.io/component: auth
    app.kubernetes.io/instance: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example
      app.kubernetes.io/component: auth
      app.kubernetes.io/instance: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example
        app.kubernetes.io/component: auth
        app.kubernetes.io/instance: dev
    spec:
      containers:
        - name: main
          env:
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
          image: docker.io/busybox:1.28
          ports:
            - name: http
              containerPort: 8030
          args:
          - sleep
          - "1000000"
          resources:
            limits:
              memory: 2000Mi
            requests:
              cpu: 100m
              memory: 400Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: example
    app.kubernetes.io/component: auth
    app.kubernetes.io/instance: dev
spec:
  type: ClusterIP
  ports:
    - port: 8030
      targetPort: 8030
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: example
    app.kubernetes.io/component: auth
    app.kubernetes.io/instance: dev